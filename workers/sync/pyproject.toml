[project]
name = "worker-sync"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "celery[redis]>=5.3",
  "supabase>=2.4",
  "context-builder-observability",
  "worker-ingest",
  "worker-classification",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker_sync"]
