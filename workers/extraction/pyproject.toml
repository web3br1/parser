[project]
name = "worker-extraction"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "celery[redis]>=5.3",
  "supabase>=2.4",
  "context-builder-model-gateway",
  "context-builder-schema-registry",
  "context-builder-normalizers",
  "context-builder-grounding",
  "context-builder-domain",
  "context-builder-observability",
  "pywin32>=306; sys_platform == 'win32'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker_extraction"]
