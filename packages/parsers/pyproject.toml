[project]
name = "context-builder-parsers"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "openpyxl>=3.1",
  "pymupdf>=1.24",
  "python-docx>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parsers"]
